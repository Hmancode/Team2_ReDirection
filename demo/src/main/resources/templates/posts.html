<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}"></title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        h1 {
            color: #4f46e5;
            border-bottom: 3px solid #6366f1;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-controls a, .header-controls button {
            background-color: #6366f1;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
        }
        .header-controls a:hover, .header-controls button:hover {
            background-color: #4f46e5;
        }
        .post-form, .post-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .post-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .post-form button {
            background-color: #10b981;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .post-form button:hover {
            background-color: #059669;
        }
        .post-container h2 {
            font-size: 1.25rem;
            color: #1f2937;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .post-container p {
            margin-bottom: 15px;
            color: #374151;
        }
        .stats {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 10px;
        }
        .vote-buttons form {
            display: inline-block;
            margin-right: 10px;
        }
        .vote-buttons button {
            background: #e0f2f1;
            color: #064e3b;
            padding: 5px 10px;
            border: 1px solid #99f6e4;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .vote-buttons button:hover {
            background-color: #ccfbf1;
        }
        .comments {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #e5e7eb;
        }
        .comments h3 {
            font-size: 1rem;
            color: #4b5563;
            margin-bottom: 8px;
        }
        .comment-item {
            background: #f9fafb;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #4b5563;
        }
        .comment-box textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header-controls">
        <h1 th:text="${pageTitle}">Post Feed</h1>
        
        <!-- Navigation Link (changes based on current view) -->
        <div th:if="${pageTitle == 'Community Feed (All Posts)'}">
            <a th:href="@{/posts}">Switch to My Posts</a>
        </div>
        <div th:if="${pageTitle == 'My Posts'}">
            <a th:href="@{/allposts}">Switch to Community Feed (All Posts)</a>
        </div>

        <!-- Logout Form -->
        <form action="/logout" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>

    <div class="post-form">
        <h2>Create a New Post</h2>
        <form th:action="@{/posts}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <textarea name="text" rows="3" placeholder="What's on your mind, " th:placeholder="|What's on your mind, ${username}?|" required></textarea>
            <button type="submit">Submit Post</button>
        </form>
    </div>

    <hr/>

    <div class="post-container" th:each="post : ${posts}">
    
        <h2 th:text="|${post.username} says:|" class="text-indigo-600"></h2>
        <p th:text="${post.text}"></p>

        <div class="stats">
            <strong>Upvotes:</strong> <span th:text="${post.upvotes}"></span> |
            <strong>Downvotes:</strong> <span th:text="${post.downvotes}"></span>
            <span th:if="${post.upvotes - post.downvotes > 0}" style="color:green; font-weight:bold;">(+[[${post.upvotes - post.downvotes}]])</span>
            <span th:if="${post.upvotes - post.downvotes < 0}" style="color:red; font-weight:bold;">([[${post.upvotes - post.downvotes}]])</span>
        </div>

        <div class="vote-buttons">
            <form th:action="@{'/posts/' + ${post.id} + '/upvote'}" method="post" style="display:inline-block;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">👍 Upvote</button>
            </form>

            <form th:action="@{'/posts/' + ${post.id} + '/downvote'}" method="post" style="display:inline-block;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">👎 Downvote</button>
            </form>
        </div>


        <div class="comments">
            <h3>Comments (<span th:text="${post.comments.size()}"></span>)</h3>

            <div th:each="c : ${post.comments}">
                <div class="comment-item" th:text="${c}"></div>
            </div>

            <div class="comment-box">
                <form th:action="@{'/posts/' + ${post.id} + '/comment'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <textarea name="comment" rows="1" placeholder="Add a comment..." required></textarea>
                    <button type="submit">Comment</button>
                </form>
            </div>
        </div>
        <hr class="mt-4 border-gray-300"/>
    </div>

</body>
</html>
